<!DOCTYPE html>

		<meta charset="utf-8">
		<title>Plushie Merge</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}
#canvas {
	display: block;
}
#canvas:focus {
	outline: none;
}
#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}
#status, #status-splash {
	top: 0;
	bottom: 0;
}
#status {
	background-color: #f7ede3;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}
#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}
#status-splash.show-image--false {
	display: none;
}
#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}
#status-splash.use-filter--false {
	image-rendering: pixelated;
}
#status-progress, #status-notice {
	display: none;
}
#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}
#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: "Noto Sans SC", sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#f5e8de; font-family:"Noto Sans SC","Nunito",sans-serif; }
#canvas { position:fixed; left:env(safe-area-inset-left); top:env(safe-area-inset-top); width:calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right)) !important; height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom)) !important; display:block; outline:none; touch-action:none; }
#status { background:#f5e8de; color:#593c49; font:64px/1.6 "Noto Sans SC","Nunito",sans-serif;font-synthesis:none; }
#status-splash { max-width:192px; object-fit:contain; }
html,body{overscroll-behavior:none;overflow:hidden;width:100%;height:100%;margin:0}
#safe-area-probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.mobile-device #canvas,.portrait-layout #canvas{left:var(--mushies-viewport-left,0px)!important;top:var(--mushies-viewport-top,0px)!important;width:var(--mushies-viewport-width,100vw)!important;height:var(--mushies-viewport-height,100dvh)!important}
.mobile-device #status,.portrait-layout #status{font-size:22px}
#portrait-guard{position:fixed;inset:0;z-index:100;background:#f8ecdf;color:#593c49;font:20px/1.5 "Noto Sans SC","Nunito",sans-serif;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
#portrait-guard[hidden]{display:none}
#portrait-guard>div{max-width:520px}
#portrait-guard h1{font-size:32px;margin:0 0 12px}
